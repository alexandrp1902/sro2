<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Рейнджеры" />
    <meta name="theme-color" content="#05060a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Космические Рейнджеры Online</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
      <div id="status" class="status" data-state="offline">…</div>
      <div id="flight" class="flight">…</div>
      <canvas id="minimap" class="minimap" aria-label="Миникарта: тап — карта галактики" hidden></canvas>
      <div id="objective" class="objective" hidden></div>
      <div id="event" class="event" hidden></div>
      <div id="ship" class="ship-hud" hidden></div>
      <div id="cargo" class="cargo" data-open="false" hidden></div>
      <div id="party" class="party" hidden></div>
      <div id="target" class="target" hidden></div>
      <div id="invite" class="invite" hidden></div>
      <div id="loot" class="loot-card" hidden></div>
      <div id="feed" class="feed"></div>
      <div id="dev" class="dev" hidden></div>
      <div id="death" class="death" hidden></div>
    </div>

    <div id="stick" class="stick" hidden>
      <div class="stick-base">
        <div class="stick-dead"></div>
        <div class="stick-handle"></div>
      </div>
    </div>

    <div id="combat-pad" class="combat-pad" hidden>
      <button id="target-prev" class="target-step" type="button" aria-label="Предыдущая цель">
        <svg viewBox="0 0 40 34" aria-hidden="true"><polyline points="27,3 13,17 27,31" /></svg>
      </button>
      <div id="fire" class="fire" role="button" aria-pressed="false" data-aim="none" data-active="false">
        <div class="fire-ring"></div>
        <span class="fire-label">ОГОНЬ</span>
        <span class="fire-state">выкл</span>
      </div>
      <button id="target-next" class="target-step" type="button" aria-label="Следующая цель">
        <svg viewBox="0 0 40 34" aria-hidden="true"><polyline points="13,3 27,17 13,31" /></svg>
      </button>
    </div>

    <div id="dock" class="dock" hidden></div>

    <div id="galaxy" class="galaxy" hidden></div>

    <div id="connect" class="connect" hidden>
      <form class="connect-card">
        <div class="connect-title">Пилот</div>
        <div class="connect-hint">Новый ник с паролем заводит аккаунт. Тот же ник и пароль — на любом устройстве.</div>
        <label class="connect-label" for="pilot-name">Ник</label>
        <input
          id="pilot-name"
          name="name"
          type="text"
          maxlength="16"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
        />
        <label class="connect-label" for="pilot-password">Пароль</label>
        <input id="pilot-password" name="password" type="password" maxlength="64" autocomplete="current-password" />
        <label class="connect-label" for="pilot-server">Игровой сервер</label>
        <input
          id="pilot-server"
          name="server"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="abc-def.trycloudflare.com"
        />
        <div class="connect-error"></div>
        <div class="connect-actions">
          <button type="button" class="connect-logout" hidden>Выйти</button>
          <button type="button" class="connect-cancel">Отмена</button>
          <button type="submit">Войти</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
