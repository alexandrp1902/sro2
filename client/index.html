<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Рейнджеры" />
    <meta name="theme-color" content="#08090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Космические Рейнджеры Online</title>
  </head>
  <body class="sro-root">
    <div id="game"></div>

    <!--
      HUD (SRO Steel): статус и строка полёта — в верхнем ряду, дальше три колонки. Панели внутри колонки
      стоят потоком друг под другом, поэтому высоты никто не считает: спряталась одна — остальные поднимаются.
      Скрипты ищут узлы по id, обёртки для них невидимы.
    -->
    <div id="hud">
      <div id="status" class="status sro-pane sro-pane--pill" data-state="offline">…</div>
      <div id="flight" class="flight sro-pane sro-pane--pill sro-num">…</div>

      <div class="hud-left">
        <div id="ship" class="ship-hud sro-pane" hidden></div>
        <div id="cargo" class="cargo sro-pane" data-open="false" hidden></div>
        <!-- Центр живёт в левой колонке: на ПК он fixed посередине экрана, на телефоне течёт под трюмом. -->
        <div class="hud-centre">
          <div id="target" class="target sro-pane sro-target" hidden></div>
          <div id="feed" class="feed"></div>
          <div id="loot" class="loot-card sro-pane sro-pane--pill" hidden></div>
        </div>
      </div>

      <div class="hud-right">
        <div class="hud-corner">
          <div class="hud-corner-buttons">
            <button id="menu-open" class="menu-open hud-menu sro-btn sro-btn--icon" type="button" title="Меню" aria-label="Меню" hidden>☰</button>
            <button id="pvp" class="pvp-toggle sro-btn sro-btn--icon" type="button" data-on="false" aria-pressed="false" hidden>PvP<small>выкл</small></button>
          </div>
          <canvas id="minimap" class="minimap" aria-label="Миникарта: тап — карта галактики" title="Карта галактики · M" hidden></canvas>
        </div>
        <div id="objective" class="objective sro-pane" hidden></div>
        <div id="event" class="event sro-pane" hidden></div>
        <div id="dev" class="dev" hidden></div>
      </div>

      <div id="party" class="party sro-pane" hidden></div>
      <div id="invite" class="invite sro-pane sro-dialog" hidden></div>
      <div id="tips" class="tips sro-pane sro-dialog" hidden></div>
      <!-- Сюжетный диалог (M20a): свой хост, не внутри дока — тот перерисовывается целиком. -->
      <div id="dialog" class="dialog sro-pane sro-dialog" hidden></div>
      <div id="death" class="death sro-pane sro-pane--alert" hidden></div>
    </div>

    <div id="stick" class="stick" hidden>
      <div class="stick-base sro-stick">
        <div class="stick-dead"></div>
        <div class="stick-handle sro-stick__handle"></div>
      </div>
    </div>

    <div id="combat-pad" class="combat-pad" hidden>
      <button id="target-prev" class="target-step sro-btn sro-btn--ghost" type="button" aria-label="Предыдущая цель">
        <svg viewBox="0 0 40 34" aria-hidden="true"><polyline points="27,3 13,17 27,31" /></svg>
      </button>
      <div id="fire" class="fire sro-fire" role="button" aria-pressed="false" data-aim="none" data-active="false">
        <div class="fire-ring"></div>
        <span class="fire-label sro-fire__label">ОГОНЬ</span>
        <span class="fire-state sro-fire__state">выкл</span>
      </div>
      <button id="target-next" class="target-step sro-btn sro-btn--ghost" type="button" aria-label="Следующая цель">
        <svg viewBox="0 0 40 34" aria-hidden="true"><polyline points="13,3 27,17 13,31" /></svg>
      </button>
    </div>

    <div id="dock" class="dock" hidden></div>

    <!--
      Вопрос «точно?» — вне HUD и после дока: у HUD position: fixed, а это свой слой, и любой z-index
      внутри него остаётся под экраном дока. А спрашивают теперь и в доке — перед продажей модуля (M20).
    -->
    <div id="confirm" class="confirm sro-pane sro-dialog" hidden></div>

    <div id="galaxy" class="galaxy" hidden></div>
    <div id="trade" class="trade" hidden></div>

    <div id="controls" class="galaxy controls" hidden></div>

    <div id="audio" class="galaxy audio" hidden></div>

    <!-- Бургер-меню (M15.5): рядом с #dock, а не внутри, — экран дока перерисовывается целиком. -->
    <div id="menu" class="menu" hidden></div>

    <!-- Смена пароля (M15.7): рядом с меню, а не внутри дока — тот перерисовывается целиком. -->
    <div id="password" class="password" hidden></div>

    <div id="connect" class="connect" hidden>
      <!-- onsubmit: пока скрипт не загрузился (или упал), браузер не должен уводить логин и пароль в адрес страницы. -->
      <form class="connect-card sro-pane sro-pane--window" onsubmit="return false">
        <div class="connect-title title-dialog">Космические рейнджеры онлайн</div>
        <!-- Вкладки (M15.8): пока их не было, новый игрок не понимал, что пилот заводится здесь же. -->
        <div class="connect-tabs sro-tabs">
          <button type="button" class="connect-tab sro-tab" data-tab="login" aria-pressed="true">Вход</button>
          <button type="button" class="connect-tab sro-tab" data-tab="register" aria-pressed="false">Регистрация</button>
        </div>
        <!-- Текст подсказки, подпись кнопки и поле повтора пароля меняет pilotForm.ts под выбранную вкладку. -->
        <div class="connect-hint sro-muted">Введите логин и пароль своего пилота</div>
        <label class="connect-label sro-field" for="pilot-name">Логин</label>
        <input
          id="pilot-name"
          class="sro-input"
          name="name"
          type="text"
          maxlength="16"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
        />
        <div class="connect-note sro-muted"></div>
        <label class="connect-label sro-field" for="pilot-password">Пароль</label>
        <input id="pilot-password" class="sro-input" name="password" type="password" maxlength="64" autocomplete="current-password" />
        <!-- Повтор пароля: только на вкладке «Регистрация» — пароль не восстановить, опечатка теряет аккаунт. -->
        <div class="connect-confirm" hidden>
          <label class="connect-label sro-field" for="pilot-confirm">Повторите пароль</label>
          <input id="pilot-confirm" class="sro-input" name="confirm" type="password" maxlength="64" autocomplete="new-password" />
        </div>
        <!-- Карточки пути (M15.5): видны, только когда ник свободен, — то есть когда заводится аккаунт. -->
        <div class="connect-careers" hidden></div>
        <label class="connect-label sro-field" for="pilot-server">Игровой сервер</label>
        <input
          id="pilot-server"
          class="sro-input"
          name="server"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="abc-def.trycloudflare.com"
        />
        <div class="connect-error sro-warn"></div>
        <div class="connect-actions">
          <button type="button" class="connect-logout sro-btn sro-btn--danger" hidden>Выйти</button>
          <button type="button" class="connect-cancel sro-btn">Отмена</button>
          <button type="submit" class="sro-btn sro-btn--primary">Войти</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
