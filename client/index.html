<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Рейнджеры" />
    <meta name="theme-color" content="#05060a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Космические Рейнджеры Online</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
      <div id="status" class="status" data-state="offline">…</div>
    </div>

    <div id="connect" class="connect" hidden>
      <form class="connect-card">
        <div class="connect-title">Адрес игрового сервера</div>
        <input
          name="server"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="abc-def.trycloudflare.com"
        />
        <div class="connect-error"></div>
        <div class="connect-actions">
          <button type="button" class="connect-cancel">Отмена</button>
          <button type="submit">Подключиться</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
