<!doctype html><html lang="ru"><meta charset="utf-8"><title>SRO — восемь направлений сборки</title>
<style>body{margin:20px;background:#111821;color:#e4e6ea;font:16px system-ui}a{color:#aed3f0}.grid{display:grid;grid-template-columns:repeat(4,330px);gap:18px}.card{background:#202c38;padding:12px}canvas{background:#344250;display:block}button,label{margin:10px}small{display:block}#error{color:#faa}</style>
<h1>Средний мех: калибровка восьми направлений</h1><p><a href="assembly.html">Редактор сборки</a> · <a href="medium-rig.json">Данные креплений</a></p>
<label><input id="guides" type="checkbox">Крепления и дуло</label><label><input id="gun" type="checkbox">Уничтожена правая рука</label><label><input id="shield" type="checkbox">Уничтожена левая рука</label><p id="error"></p><main class="grid"></main>
<script src="rig-data.js"></script><script src="rig-renderer.js"></script><script>
(async()=>{try{const loaded=await MechRigRenderer.load(MECH_RIG);const cards=[];for(const d of MECH_RIG.directions){const card=document.createElement('section');card.className='card';const label=document.createElement('strong');label.textContent=d;const c=document.createElement('canvas');c.width=c.height=300;const small=document.createElement('canvas');small.width=300;small.height=128;const note=document.createElement('small');note.textContent='64 / 96 / 128 px';card.append(label,c,note,small);document.querySelector('main').append(card);cards.push({d,c,small});}function draw(){const hidden=[];if(document.querySelector('#gun').checked)hidden.push('arm-autocannon-right');if(document.querySelector('#shield').checked)hidden.push('shield-light-left');for(const {d,c,small}of cards){const ctx=c.getContext('2d');ctx.clearRect(0,0,300,300);MechRigRenderer.draw(ctx,loaded,d,{size:300,hidden,guides:document.querySelector('#guides').checked});const s=small.getContext('2d');s.clearRect(0,0,300,128);for(const [x,size]of [[0,64],[68,96],[168,128]])MechRigRenderer.draw(s,loaded,d,{x,size,hidden});}}for(const input of document.querySelectorAll('input'))input.onchange=draw;draw();document.body.dataset.ready='true';}catch(e){document.querySelector('#error').textContent=e.message;}})();
</script></html>
